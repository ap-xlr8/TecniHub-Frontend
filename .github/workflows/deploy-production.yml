name: Deploy frontend production

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: frontend-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate frontend
        run: |
          npm run format:check
          npm run lint
          npm run build
          npm run pwa:verify
          npm run test:ci
      - name: Check production settings
        env:
          STATIC_WEB_APP_URL: ${{ vars.AZURE_STATIC_WEB_APPS_URL }}
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          test -n "$STATIC_WEB_APP_URL" || { echo "::error::Missing AZURE_STATIC_WEB_APPS_URL production variable"; exit 1; }
          test -n "$DEPLOYMENT_TOKEN" || { echo "::error::Missing production AZURE_STATIC_WEB_APPS_API_TOKEN secret"; exit 1; }
      - name: Deploy to Azure Static Web Apps production
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/tecnihub-frontend/browser
          output_location: ''
          skip_app_build: true
      - name: Check production health
        env:
          HEALTH_CHECK_URL: ${{ vars.AZURE_STATIC_WEB_APPS_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 20 "$HEALTH_CHECK_URL"
